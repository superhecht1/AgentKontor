<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#050510"/>
  <rect x="0" y="0" width="1200" height="4" fill="#6c5ce7"/>
  <!-- Grid pattern -->
  <defs>
    <pattern id="g" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(108,92,231,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <!-- Logo -->
  <text x="600" y="240" font-size="72" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif" font-weight="800" letter-spacing="-2">Agent<tspan fill="#a29bfe">Kontor</tspan></text>
  <!-- Tagline -->
  <text x="600" y="320" font-size="28" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="system-ui,-apple-system,sans-serif">Baue deinen eigenen KI-Agenten</text>
  <!-- Feature chips -->
  <rect x="280" y="380" width="160" height="44" rx="22" fill="rgba(108,92,231,0.15)" stroke="rgba(108,92,231,0.3)" stroke-width="1"/>
  <text x="360" y="407" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif">🌐 Website</text>
  <rect x="460" y="380" width="160" height="44" rx="22" fill="rgba(108,92,231,0.15)" stroke="rgba(108,92,231,0.3)" stroke-width="1"/>
  <text x="540" y="407" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif">💬 WhatsApp</text>
  <rect x="640" y="380" width="160" height="44" rx="22" fill="rgba(108,92,231,0.15)" stroke="rgba(108,92,231,0.3)" stroke-width="1"/>
  <text x="720" y="407" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif">✈️ Telegram</text>
  <rect x="820" y="380" width="100" height="44" rx="22" fill="rgba(108,92,231,0.15)" stroke="rgba(108,92,231,0.3)" stroke-width="1"/>
  <text x="870" y="407" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif">+ mehr</text>
  <!-- URL -->
  <text x="600" y="570" font-size="20" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui,sans-serif">agentkontor.de</text>
</svg>
